<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <title>My Life in Data — Summary</title>
  <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          background: #f5f6f8;
          color: #222;
          max-width: 1100px;
          margin: 0 auto;
          padding: 40px;
        }

        h1 {
          margin-bottom: 5px;
        }

        .subtitle {
          color: #666;
          margin-bottom: 35px;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 20px;
        }

        .card {
          background: white;
          border-radius: 12px;
          padding: 25px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .label {
          font-size: 14px;
          color: #777;
          margin-bottom: 10px;
        }

        .value {
          font-size: 32px;
          font-weight: 700;
        }
      </style>
</head>
<html>
  <body>
    <h1>My Life in Data</h1>
    <p class="subtitle">Summary of the first 1 days</p>
    <div class="grid">
      <div class="card">
        <div class="label">Mean happiness</div>
        <div class="value">6 / 10</div>
      </div>
      <div class="card">
        <div class="label">Days with university worked completed</div>
        <div class="value">100%</div>
      </div>
      <div class="card">
        <div class="label">Days coaching</div>
        <div class="value">0%</div>
      </div>
      <div class="card">
        <div class="label">Days felt good</div>
        <div class="value">100%</div>
      </div>
      <div class="card">
        <div class="label">Days left the house</div>
        <div class="value">100%</div>
      </div>
      <div class="card">
        <div class="label">Days went on a walk</div>
        <div class="value">0%</div>
      </div>
      <div class="card">
        <div class="label">Days cried</div>
        <div class="value">0%</div>
      </div>
      <div class="card">
        <div class="label">Days ill</div>
        <div class="value">0%</div>
      </div>
      <div class="card">
        <div class="label">Days 1% better</div>
        <div class="value">100%</div>
      </div>
    </div>
  </body>
</html>
</html>
